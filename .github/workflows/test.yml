name: Tests
on:
  pull_request:
  push:
    # main plus any session branch — hardcoding one branch name left this suite unrun
    # for a whole session when the branch changed (found 2026-09-17, third pass).
    branches: [main, "arena/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # impact_test.js was missing from this list (found 2026-09-18 while auditing the workflow):
      # the lineup-impact model — the thing the brief calls the intelligence layer — was only ever
      # run by hand in the sandbox. A suite that skips the model it ships is not a suite.
      - run: |
          node tools/smoke_test.js
          node tools/integration_test.js
          node tools/impact_test.js
          node tools/intelligence_test.js
          node tools/poll_fixture_test.js
          node tools/regression_test.js
          node tools/verify_reporters_test.js
          node nfl-nba-alert-backend/tools/test.js
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Browser interaction tests (fixture transport)
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node tools/browser_test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          include-hidden-files: true
          path: .audit/*.png
