name: Public source audit
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths: [tools/verify_live.py, tools/collect_official.py, assets/js/data.js, .github/workflows/live-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      # exits non-zero only on CAPABILITY drift (a source now answering in a way that changes what
      # the product may claim, e.g. the official report page going live). Everything else is recorded
      # in data/audit/latest.json for the reader — see the docstring in tools/verify_live.py.
      - run: python3 tools/verify_live.py
      # Evidence lands on whatever branch ran the audit, so the deployed sources page can show
      # the newest verdicts. The previous version hard-coded one session branch and pushed nothing
      # at all after that branch was retired.
      # always(): the evidence is the point of this job, so it lands even when the audit finds a
      # problem — a red job with no artifact would hide exactly the change worth seeing.
      - name: Persist review evidence on the branch that ran the audit
        if: always()
        run: |
          # keep the last parsed PDF text as the human-readable fixture the parser regression uses
          for f in .audit/nba-pdf-sample.txt .audit/sample.txt; do
            if [ -s "$f" ]; then cp "$f" data/audit/sample-report.txt; break; fi
          done
          git config user.name "source-audit bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit
          if git diff --cached --quiet; then
            echo "no audit changes to commit"
            exit 0
          fi
          git commit -m "audit: record observed source responses ($(date -u +%Y-%m-%dT%H:%MZ))"
          PUSH_OK=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then PUSH_OK=1; break; fi
            echo "push attempt $attempt rejected (collector committed first) - rebasing and retrying"
            git fetch origin "$GITHUB_REF_NAME" || true
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; echo "rebase not clean; stopping"; break; }
            sleep $((attempt * 5))
          done
          if [ "$PUSH_OK" != 1 ]; then
            echo "::warning::audit evidence not committed to $GITHUB_REF_NAME this run; it remains in the workflow artifact."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit
          include-hidden-files: true
          path: |
            data/audit/latest.json
            .audit/
          retention-days: 14
