name: Public source audit
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ad73-nbainjuryreport]
    paths: [tools/verify_live.py, .github/workflows/live-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python3 tools/verify_live.py
      - name: Persist review evidence on the session branch only
        if: github.ref == 'refs/heads/arena/01a0ad73-nbainjuryreport'
        run: |
          cp .audit/sample.txt data/audit/sample-report.txt || true
          git config user.name "source-audit bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit
          git diff --cached --quiet || git commit -m "audit: record observed source responses"
          git push origin HEAD:arena/01a0ad73-nbainjuryreport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit
          include-hidden-files: true
          path: |
            data/audit/latest.json
            .audit/
          retention-days: 14
